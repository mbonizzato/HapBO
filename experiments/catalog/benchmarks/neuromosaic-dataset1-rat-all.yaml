artifact_format: llm-bo-benchmark-catalog-v1
benchmark_id: neuromosaic-dataset1-rat-all
family: offline-finite
implementation_status: available
adapter: neuromosaic-dataset1-rat
problem_id_template: "{subject}-{muscle}"
# Noisy emulator (OptimizeNeurostim): each query returns a random valid single
# trial from sorted_resp; regret is measured on the true means (sorted_respMean).
noisy: true
# Every recorded muscle of Dataset 1: knee flexor, tibialis anterior, medial gastrocnemius,
# knee extensor and gluteus (40 rat-muscle maps).
# muscle_slug fills the {muscle_slug} placeholder of a prior_path template.
cases:
